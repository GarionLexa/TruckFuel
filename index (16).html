<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1115">
<title>TruckFuel — твой путь к идеальному весу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1115;--card:#1A1D24;--card2:#22262F;--line:#272C36;
    --lime:#C5F82A;--steel:#5E6B7C;--txt:#F5F7FA;--dim:#8A93A3;
    --green:#2E7D32;--warn:#ED6C02;--red:#E53935;--blue:#2196F3;
    --purple:#9C27B0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:Inter,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased}
  body{min-height:100dvh;padding-bottom:90px}
  .wrap{max-width:520px;margin:0 auto;padding:52px 16px 16px}
  .h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
  .h2{font-size:15px;font-weight:600;margin:20px 0 10px;color:var(--txt)}
  .sub{font-size:13px;color:var(--dim);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  
  .btn{background:var(--lime);color:#0F1115;border:none;border-radius:12px;
    padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;
    transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);}
  .btn:active{transform:scale(0.95)}
  .btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn-sm{padding:8px 12px;font-size:12px}
  .btn-red{background:var(--red);color:#fff}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:12px;color:var(--dim);cursor:pointer;font-family:inherit;transition: all 0.2s}
  .pill.on{background:var(--lime);color:#0F1115;border-color:var(--lime);font-weight:700}
  .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .meta{font-size:12px;color:var(--dim);margin-top:4px}
  .kcal-lg{font-size:44px;font-weight:800;color:var(--lime);letter-spacing:-1px}
  .stat{text-align:center;flex:1}
  .stat b{display:block;font-size:18px;color:var(--txt)}
  .stat span{font-size:11px;color:var(--dim)}
.coach-card { background: linear-gradient(135deg, rgba(33,150,243,0.15) 0%, rgba(26,29,36,1) 100%); border-left: 4px solid var(--blue); }
.coach-title { color: var(--blue); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

.motivation-card { background: linear-gradient(135deg, rgba(156,39,176,0.15) 0%, rgba(26,29,36,1) 100%); border-left: 4px solid var(--purple); }
.motivation-title { color: var(--purple); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

.supplement-card { border-left: 4px solid var(--green); }
.supplement-title { color: var(--green); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

.bar{height:10px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;background:var(--lime);border-radius:5px;transition:width 0.8s cubic-bezier(0.4, 0, 0.2, 1)}

.ring-wrap{display:flex;align-items:center;justify-content:center;position:relative;margin:8px 0}
.ring-txt{position:absolute;text-align:center}
.ring-txt small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.ring-svg circle { transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(26,29,36,.95);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;background:none;border:none;color:var(--steel);padding:6px 0;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;
  font-family:inherit;cursor:pointer;font-weight:500;transition:color 0.2s}
nav button.on{color:var(--lime);font-weight:700}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:12px;color:var(--txt);font-family:inherit;font-size:15px;outline:none;transition:border-color 0.2s}
input:focus{border-color:var(--lime)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.8px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

.water-tracker{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.bottle { 
  width: 38px; height: 52px; border-radius: 6px; background: var(--card2); border: 2px solid var(--steel); 
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px;
  font-size: 10px; font-weight: 700; cursor: pointer; color: var(--steel); 
  position: relative; overflow: hidden; transition: border-color 0.3s;
}
.bottle::before { content: ''; position: absolute; top: -6px; width: 12px; height: 6px; background: var(--steel); border-radius: 2px 2px 0 0; left: 11px; z-index: 2; transition: background 0.3s;}
.bottle-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--lime); transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
.bottle.on { border-color: var(--lime); color: var(--bg); }
.bottle.on::before { background: var(--lime); }
.bottle.overdue { border-color: var(--red); color: var(--red); animation: pulse 1.5s infinite; }
.bottle.overdue::before { background: var(--red); }
.bottle span { position: relative; z-index: 3; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(229, 57, 53, 0); } 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); } }
  .dish h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.2px}
  .dish .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .btn-act{background:var(--lime);color:#0F1115;border:none;
    padding:8px 14px;border-radius:10px;font-weight:700;font-size:12px;
    font-family:inherit;cursor:pointer;transition:transform 0.1s}
  .btn-act:active { transform: scale(0.95); }
  .btn-act.ghost{background:var(--card2);color:var(--txt); border:1px solid var(--line)}
  .btn-eaten { background: transparent; border: 1px solid var(--steel); color: var(--steel); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.2s;}
  .btn-eaten:active { transform: scale(0.95); }
  .btn-eaten.on { background: var(--lime); border-color: var(--lime); color: var(--bg); }
  
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
  .modal{background:var(--card);border-top-left-radius:24px;border-top-right-radius:24px;
    width:100%;max-width:520px;padding:20px 16px 32px;animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 4px;font-size:18px}
  .modal .alt{display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(40px)}to{transform:translateY(0)}}
  
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
  .cal .wd{text-align:center;font-size:10px;color:var(--dim);padding:4px 0}
  .cal .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:10px;background:transparent;color:var(--txt);font-size:14px;
    font-weight:500;cursor:pointer;border:2px solid transparent;padding:0;font-family:inherit;transition: all 0.2s}
  .cal .day.shift{background:var(--lime);color:#0F1115;font-weight:700}
  .cal .day.today{font-weight:800}
  .cal .day.sel{border-color:var(--txt)}
  .cal .day.empty{pointer-events:none}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cal-head b{font-size:15px;text-transform:capitalize}
  .cal-head button{background:none;border:none;color:var(--lime);font-size:24px;
    padding:0 12px;cursor:pointer;font-family:inherit}
  .shop-row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px;cursor:pointer}
  .shop-row:last-child{border:none}
  .chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--steel);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;
    color:transparent;font-weight:800;transition: all 0.2s}
  .chk.on{background:var(--lime);border-color:var(--lime);color:#0F1115}
  .shop-row.done .txt{color:var(--dim);text-decoration:line-through}
  .exp{background:none;border:none;color:var(--lime);font-size:22px;cursor:pointer;font-family:inherit;padding:0 8px}
  .ing{color:var(--dim);font-size:13px;margin:3px 0}
  .ing b{color:var(--lime);font-weight:600}
  .step{color:var(--txt);font-size:13px;margin:4px 0;line-height:1.5}
  .rec-list{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .warn-box{background:rgba(237,108,2,.15);border:1px solid var(--warn);border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;color:#ffb74d}
  .danger-box{background:rgba(229,57,53,.15);border:1px solid var(--red);border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;color:#ff8a80}
  .badge{display:inline-block;background:var(--lime);color:var(--bg);font-weight:800;font-size:11px;padding:4px 8px;border-radius:6px;margin-right:6px}
  .badge-mandatory { background: var(--blue); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }
  .dish.current{border:2px solid var(--lime); box-shadow:0 0 12px rgba(197,248,42,0.15)}
  .dish.current .lbl{color:var(--lime)}
  .cook-mode { font-size: 22px; line-height: 1.6; }
  .cook-step { padding: 20px; background: var(--card2); border-radius: 16px; margin-bottom: 12px; border-left: 6px solid var(--lime); }
  
  .history-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .history-row:last-child { border:none; }
  .history-date { color: var(--dim); }
  .history-weight { font-weight: 700; }
  .history-delta { font-size: 12px; margin-left: 8px; }
  
  .supplement-row { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .supplement-row:last-child { border:none; }
  .supplement-icon { font-size:20px; flex-shrink:0; }
  .supplement-name { font-weight:600; font-size:14px; }
  .supplement-desc { font-size:12px; color:var(--dim); margin-top:2px; line-height:1.4; }
  .supplement-dose { font-size:11px; color:var(--lime); font-weight:700; margin-top:4px; }
</style>
</head>

const DISHES = RAW.map(function(r){return {id:r[0],type:r[1],name:r[2],ing:r[3],recipe:r[4].split('|')};});
const DISH_BY_ID = {}; DISHES.forEach(function(d){DISH_BY_ID[d.id]=d;});

const DISH_MACROS = {};
DISHES.forEach(function(d){
  var kcal=0,p=0,f=0,c=0,fiber=0,sodium=0;
  d.ing.forEach(function(x){
    var prod=P[x[0]]; if(!prod) return;
    var k=(prod.grams*x[1])/100;
    kcal+=prod.kcal*k; p+=prod.p*k; f+=prod.f*k; c+=prod.c*k;
    fiber+=prod.fiber*k; sodium+=prod.sodium*k;
  });
  DISH_MACROS[d.id]={kcal:Math.round(kcal),p:Math.round(p),f:Math.round(f),c:Math.round(c),fiber:Math.round(fiber),sodium:Math.round(sodium)};
});

function portionSummary(d){
  return d.ing.map(function(x){
    var prod=P[x[0]];
    return x[1]===1 ? prod.measure+' '+prod.name.toLowerCase() : x[1]+' × '+prod.measure;
  }).join(' + ');
}

function updateWeight(w) {
  if (!w || w <= 0) return;
  var t = today();
  var existing = null;
  for(var i=0; i<S.weightHistory.length; i++){
    if(S.weightHistory[i].date === t) { existing = S.weightHistory[i]; break; }
  }
  if (existing) existing.weight = w;
  else S.weightHistory.push({date: t, weight: w});
  
  S.weightHistory.sort(function(a,b){ return b.date.localeCompare(a.date); });
  S.profile.weight = w;
  save();
}

function getWeightChange() {
  if (S.weightHistory.length < 2) return null;
  var last = S.weightHistory[0].weight;
  var prev = S.weightHistory[1].weight;
  return (last - prev).toFixed(1);
}

function generatePlan(date, kcalTarget, shiftMode){
  var plan = {}; var lastUsed = {};
  var timeline = getShiftTimeline(shiftMode);
  var shares = {breakfast:.25, lunch:.35, dinner:.25, snack:.15, night:.10};
  
  timeline.forEach(function(slot, i){
    var wanted = kcalTarget * (shares[slot.type] || 0.10);
    var all = DISHES.filter(function(d){return d.type === slot.type;});
    if(!all.length) return;
    
    var fresh = all.filter(function(d){return !lastUsed[d.id] || i - lastUsed[d.id] >= 5;});
    var pool = fresh.length ? fresh : all;
    var scored = pool.map(function(d){
      var k = DISH_MACROS[d.id].kcal;
      return {d: d, score: Math.abs(k - wanted) + (Math.random() * 60 - 30)};
    }).sort(function(a, b){return a.score - b.score;});
    
    var chosen = scored[0].d;
    plan[slot.type] = chosen.id;
    lastUsed[chosen.id] = i;
  });
  return plan;
}

function findAlternatives(dishId){
  var dish=DISH_BY_ID[dishId]; if(!dish) return [];
  var cur=DISH_MACROS[dishId];
  return DISHES.filter(function(d){return d.type===dish.type&&d.id!==dishId;})
    .map(function(d){
      var m=DISH_MACROS[d.id];
      var dist=Math.abs(m.kcal-cur.kcal)+Math.abs(m.p-cur.p)*5+Math.abs(m.c-cur.c)*2;
      return {d:d,dist:dist};
    }).sort(function(a,b){return a.dist-b.dist;})
    .slice(0,3).map(function(x){return x.d;});
}

function getTodayDishes(){
  var day=S.plan[today()]; if(!day) return [];
  var timeline = getShiftTimeline(S.profile.shiftMode);
  return timeline.map(function(slot){

  }).filter(function(x){return x.dish;});
}
function eatenKcalToday(){
  return getTodayDishes().filter(function(x){return S.eaten[today()]&&S.eaten[today()][x.dish.id];}).reduce(function(s,x){return s+DISH_MACROS[x.dish.id].kcal;},0);
}
function planKcalToday(){return getTodayDishes().reduce(function(s,x){return s+DISH_MACROS[x.dish.id].kcal;},0);}
function burnedToday(){return S.workouts.filter(function(w){return w.date===today();}).reduce(function(s,w){var x=W.find(function(y){return y.id===w.id;});return s+(x?x.kcal:0);},0);}

function getCurrentMealIndex() {
  if (!S.profile) return -1;
  var timeline = getShiftTimeline(S.profile.shiftMode);
  if (S.profile.shiftMode === 'flexible') return -1;
  
  var now = new Date();
  var currentMinutes = now.getHours() * 60 + now.getMinutes();
  
  for (var i = timeline.length - 1; i >= 0; i--) {
    var parts = timeline[i].time.split(':');
    var mealMinutes = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    if (currentMinutes >= mealMinutes) return i;
  }
  return 0;
}

  var waterGoal = Math.ceil((p.weight * 30) / 500); 
  var expectedBottles = 0;
  if (currentHour >= 7 && currentHour <= 23) {
    expectedBottles = Math.ceil(((currentHour - 7) / 16) * waterGoal);
  } else if (currentHour > 23) {
    expectedBottles = waterGoal;
  }
  
  var bottlesHTML = '';
  for (var i=1; i<=waterGoal; i++) {
    var isDrunk = S.waterDrunk >= i;
    var isOverdue = (!isDrunk && i <= expectedBottles);
    var cls = isDrunk ? 'on' : (isOverdue ? 'overdue' : '');
    var fillHeight = isDrunk ? '100%' : '0%';
    bottlesHTML += '<div class="bottle ' + cls + '" data-action="drink-water" data-idx="' + i + '">'+

  var startW = p.startWeight || p.weight;

    return '<button class="'+cls.join(' ')+'" data-action="cal-day" data-date="'+c+'">'+dn+'</button>';

  var monthName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});

function renderShopping(){
  var list={};
  list['voda'] = Math.ceil(S.shifts.length * (calcWater(S.profile.weight)/5));
  
  S.shifts.forEach(function(date){
    var day=S.plan[date]; if(!day) return;
    var timeline = getShiftTimeline(S.profile.shiftMode);
    timeline.forEach(function(slot){
      var d=DISH_BY_ID[day[slot.type]]; if(!d) return;
      d.ing.forEach(function(x){
        if(x[0]!=='voda') list[x[0]]=(list[x[0]]||0)+x[1];
      });
    });
  });

  var fridgeItems = []; var shelfItems = [];
  for(var pid in list){
    var p=P[pid]; if(!p) continue;
    var qty = list[pid];
    if(p.measure.indexOf('банки') !== -1 || p.measure.indexOf('пакетик') !== -1) qty = Math.ceil(qty);
    var item = {pid:pid,qty:qty,p:p};
    if(p.store === 'fridge') fridgeItems.push(item); else shelfItems.push(item);
  }
  
  var renderRows = function(arr, isFridge) {
    if(arr.length === 0) return '';
    var catColor = isFridge ? 'var(--warn)' : 'var(--green)';
    var title = isFridge ? '❄️ Скоропортящиеся (докупить по пути)' : '📦 Длительного хранения (купить заранее)';
    var rows = arr.map(function(x){
      var on=!!S.shoppingChecked[x.pid];
      return '<div class="shop-row '+(on?'done':'')+'" data-action="shop-toggle" data-pid="'+x.pid+'">'+
        '<div class="chk '+(on?'on':'')+'">'+(on?'✓':'')+'</div>'+
        '<div style="flex:1"><div class="txt" style="font-size:14px">'+(x.p.brand!=='—'?'<b>'+x.p.brand+'</b> — ':'')+x.p.name.toLowerCase()+'</div>'+
        '<div class="meta">'+(x.pid==='voda'?x.qty+' бут. по 5 л':x.qty+' × '+x.p.measure+' ≈ '+Math.round(x.p.grams*x.qty)+' г')+'</div></div>'+
      '</div>';
    }).join('');
    return '<div class="card" style="border-left:4px solid '+catColor+'"><div class="lbl" style="margin-bottom:6px;color:'+catColor+'">'+title+'</div>'+rows+'</div>';
  };

  var total=Object.keys(list).length;
  var bought=Object.keys(list).filter(function(pid){return S.shoppingChecked[pid];}).length;

  return '<div class="wrap">'+
    '<div class="h1">Список покупок</div>'+
    '<div class="sub">'+bought+' из '+total+' куплено · на '+S.shifts.length+' дн. вахты</div>'+
    renderRows(shelfItems, false)+renderRows(fridgeItems, true)+
  '</div>';
}

      }).join('');
      if(!items) return '';
      var title = t === 'night' ? 'Ночные перекусы (легкий белок)' : MEAL_LABEL[t];
      return '<div class="h2">'+title+'</div>'+items;
    }).join('')+
  '</div>';
}

function renderWorkouts(){
  var b=bmr(S.profile),t=tdee(b);
  var baseDeficit=Math.max(100,t-(planKcalToday()||target(t)));
  var rows=W.map(function(w){
    var open=(S._openWo===w.id);
    var speedup=((7700/baseDeficit)-(7700/(baseDeficit+w.kcal))).toFixed(2);
    var steps=w.steps.map(function(s){return '<div class="step">• '+s+'</div>';}).join('');
    return '<div class="card">'+
      '<div class="row" style="align-items:flex-start">'+
        '<div style="flex:1"><h3 style="margin:0;font-size:16px">'+w.name+'</h3>'+
          '<div class="meta">'+w.min+' мин · ~'+w.kcal+' ккал · ускоряет цель на '+speedup+' дн/кг</div></div>'+
        '<button class="exp" data-action="toggle-wo" data-id="'+w.id+'">'+(open?'−':'+')+'</button>'+
      '</div>'+
      (open?'<div class="rec-list">'+steps+
        '<button class="btn" style="width:100%;margin-top:10px" data-action="log-wo" data-id="'+w.id+'">Выполнено · +'+w.kcal+' ккал</button>'+
      '</div>':'')+
    '</div>';
  }).join('');
  return '<div class="wrap">'+
    '<div class="h1">Тренировки</div>'+
    '<div class="sub">Сожжено сегодня: '+burnedToday()+' ккал</div>'+
    rows+
  '</div>';
}

function renderProfile(){
  var p=S.profile;
  var b=bmr(p),t=tdee(b),tg=target(t);
  
  var historyHTML = '';
  if (S.weightHistory && S.weightHistory.length > 0) {
    historyHTML = '<div class="card"><div class="lbl" style="margin-bottom:8px">История веса</div>' +
      S.weightHistory.slice(0, 5).map(function(h, i){
        var deltaHTML = '';
        if (i < S.weightHistory.length - 1) {
          var d = (h.weight - S.weightHistory[i+1].weight).toFixed(1);
          var sign = d < 0 ? '' : '+';
          var color = d < 0 ? 'var(--lime)' : 'var(--red)';
          deltaHTML = '<span class="history-delta" style="color:'+color+'">'+sign+d+' кг</span>';
        }
        return '<div class="history-row">'+
          '<span class="history-date">'+h.date+'</span>'+
          '<span><span class="history-weight">'+h.weight+' кг</span>'+deltaHTML+'</span>'+
        '</div>';
      }).join('') +
    '</div>';
  }

  return '<div class="wrap">'+
    '<button class="btn btn-ghost btn-sm" data-action="nav" data-tab="dash" style="margin-bottom:16px">‹ Назад</button>'+
    '<div class="h1">Профиль</div>'+
    '<div class="card">'+
      '<div class="field"><label>Пол</label><div class="tabs">'+
        '<button class="pill '+(p.gender==='m'?'on':'')+'" data-action="gender" data-val="m">Мужчина</button>'+
        '<button class="pill '+(p.gender==='f'?'on':'')+'" data-action="gender" data-val="f">Женщина</button>'+
      '</div></div>'+
      '<div class="field"><label>Возраст</label><input id="f-age" type="number" inputmode="numeric" value="'+p.age+'"></div>'+
      '<div class="field"><label>Рост, см</label><input id="f-height" type="number" inputmode="numeric" value="'+p.height+'"></div>'+
      '<div class="field"><label>Текущий вес, кг</label><input id="f-weight" type="number" inputmode="decimal" value="'+p.weight+'"></div>'+
      '<div class="field"><label>Целевой вес, кг</label><input id="f-target" type="number" inputmode="decimal" value="'+p.target+'"></div>'+
      '<div class="field"><label>Режим работы</label><div class="tabs">'+
        '<button class="pill '+(p.shiftMode==='day'?'on':'')+'" data-action="shift-mode" data-val="day">Дневной</button>'+
        '<button class="pill '+(p.shiftMode==='night'?'on':'')+'" data-action="shift-mode" data-val="night">Ночной</button>'+
        '<button class="pill '+(p.shiftMode==='flexible'?'on':'')+'" data-action="shift-mode" data-val="flexible">Плавающий</button>'+
      '</div></div>'+
      '<button class="btn" style="width:100%" data-action="save-profile">Сохранить</button>'+
    '</div>'+
    historyHTML+
    renderSupplementsBlock()+
    '<div class="card">'+
      '<div class="row"><span class="meta">BMR</span><b>'+b+' ккал</b></div>'+
      '<div class="row" style="margin-top:8px"><span class="meta">TDEE</span><b>'+t+' ккал</b></div>'+
      '<div class="row" style="margin-top:8px"><span class="meta">Норма (−20%)</span><b style="color:var(--lime)">'+tg+' ккал</b></div>'+
      '<div class="row" style="margin-top:8px"><span class="meta">Норма воды</span><b style="color:var(--lime)">'+calcWater(p.weight)+' л</b></div>'+
    '</div>'+
  '</div>';
}
function renderRouter(){
  if(!S.profile) return renderOnboarding();
  switch(S.tab){
    case 'cal': return renderCalendar();
    case 'shop': return renderShopping();
    case 'wo': return renderWorkouts();
    case 'rec': return renderRecipes();
    case 'profile': return renderProfile();
    default: return renderDashboard();
  }
}

function renderNav(){
  if(!S.profile) return '';
  var items=[{k:'dash',l:'Главная',i:'◎'},{k:'cal',l:'Вахты',i:'▤'},{k:'shop',l:'Покупки',i:'☐'},{k:'rec',l:'Рецепты',i:'▢'},{k:'wo',l:'Спорт',i:'△'}];
  return '<nav>'+items.map(function(x){
    return '<button class="'+(S.tab===x.k?'on':'')+'" data-action="nav" data-tab="'+x.k+'">'+
      '<span style="font-size:20px">'+x.i+'</span><span>'+x.l+'</span></button>';
  }).join('')+'</nav>';
}

function renderReplaceModal(){
  if(!S._replace) return '';
  var id=S._replace.id,date=S._replace.date,type=S._replace.type;
  var cur=DISH_BY_ID[id]; if(!cur) return '';
  var alts=findAlternatives(id);
  var curM=DISH_MACROS[id];
  var rows=alts.map(function(d){
    var m=DISH_MACROS[d.id];
    var dk=m.kcal-curM.kcal,dp=m.p-curM.p;
    var sign=function(x){return x>0?'+'+x:''+x;};
    return '<div class="alt" data-action="pick-alt" data-date="'+date+'" data-type="'+type+'" data-id="'+d.id+'">'+
      '<div style="flex:1"><div style="font-size:15px;font-weight:600">'+d.name+'</div>'+
        '<div class="meta">'+m.kcal+' ккал · Б '+m.p+' · Ж '+m.f+' · У '+m.c+'</div>'+
        '<div class="meta" style="color:var(--lime)">'+sign(dk)+' ккал · '+sign(dp)+' г белка</div></div>'+
      '<span style="color:var(--lime);font-size:22px">›</span></div>';
  }).join('');
  return '<div class="modal-bg" data-action="close-modal">'+
    '<div class="modal">'+
      '<h3>Альтернативы</h3><div class="meta" style="margin-bottom:12px">Похожие по КБЖУ</div>'+
      rows+
      '<button class="btn btn-ghost" style="width:100%;margin-top:16px" data-action="close-modal">Отмена</button>'+
    '</div></div>';
}

function renderCookMode(){
  if(!S._cookDishId) return '';
  var d = DISH_BY_ID[S._cookDishId];
  if(!d) return '';
  
  var steps = d.recipe.map(function(s,i){
    return '<div class="cook-step">'+
      '<div style="color:var(--lime); font-weight:800; font-size:16px; margin-bottom:8px;">ШАГ '+(i+1)+'</div>'+
      '<div class="cook-mode">'+s+'</div>'+
    '</div>';
  }).join('');
  
  var ingList = d.ing.map(function(x){
    var p = P[x[0]];
    return '• '+(p.brand!=='—'?p.brand+' — ':'')+p.name.toLowerCase()+': '+(x[1]===1?p.measure:x[1]+' × '+p.measure);
  }).join('<br>');

  return '<div class="modal-bg" data-action="close-cook">'+
    '<div class="modal" style="background:var(--bg)">'+
      '<div class="row" style="margin-bottom:16px">'+
        '<h3 style="font-size:22px">'+d.name+'</h3>'+
        '<button class="btn btn-ghost btn-sm" data-action="close-cook">Закрыть</button>'+
      '</div>'+
      '<div style="background:var(--card2); padding:16px; border-radius:12px; margin-bottom:16px; font-size:16px; line-height:1.6">'+
        '<div style="color:var(--lime); font-weight:800; margin-bottom:8px;">ИНГРЕДИЕНТЫ:</div>'+ingList+
      '</div>'+
      steps+
      '<button class="btn btn-red" data-action="close-cook" style="width:100%;margin-top:16px">Закрыть рецепт</button>'+
    '</div></div>';
}

function renderSOS(){
  if(!S._sos) return '';
  return '<div class="modal-bg" data-action="close-sos">'+
    '<div class="modal">'+
      '<h3 style="color:var(--red)">🆘 СТОП! Сначала сделай это:</h3>'+
      '<div class="meta" style="margin-bottom:12px">Сначала сделай это, потом решай, хочешь ли ты есть.</div>'+
      '<div style="padding:14px 0; border-bottom:1px solid var(--line); font-size:15px">💧 Выпей 2 стакана воды (500 мл)</div>'+
      '<div style="padding:14px 0; border-bottom:1px solid var(--line); font-size:15px">🥒 Съешь целый свежий огурец</div>'+
      '<div style="padding:14px 0; border-bottom:1px solid var(--line); font-size:15px">🚶‍♂️ Сделай 20 приседаний у машины</div>'+
      '<div style="padding:14px 0; border-bottom:1px solid var(--line); font-size:15px">🫖 Выпей горячего чая без сахара</div>'+
      '<div style="padding:14px 0; font-size:15px">⏱ Подожди 15 минут. Если голод остался — съешь что-то из плана.</div>'+
      '<button class="btn" data-action="close-sos" style="width:100%;margin-top:16px">Я справился</button>'+
    '</div></div>';
}

function renderWeightModal(){
  if(!S._weightModal) return '';
  return '<div class="modal-bg" data-action="close-weight-modal">'+
    '<div class="modal">'+
      '<h3>Записать вес</h3>'+
      '<div class="meta" style="margin-bottom:12px">Введи свой текущий вес. Нормы калорий и воды пересчитаются автоматически.</div>'+
      '<div class="field"><label>Вес (кг)</label><input id="new-weight-input" type="number" inputmode="decimal" value="'+S.profile.weight+'"></div>'+
      '<button class="btn" style="width:100%; margin-top:8px" data-action="save-new-weight">Сохранить</button>'+
      '<button class="btn btn-ghost" style="width:100%; margin-top:8px" data-action="close-weight-modal">Отмена</button>'+
    '</div></div>';
}

function render(){
  app.innerHTML = renderRouter() + renderNav() + renderReplaceModal() + renderCookMode() + renderSOS() + renderWeightModal();
  save();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]'); if(!el) return;
  var a=el.dataset.action;
  
  if(navigator.vibrate && (a==='drink-water' || a==='toggle-eaten' || a==='save-new-weight')) navigator.vibrate(30);
  
  if(a==='nav'){S.tab=el.dataset.tab;render();return;}
  if(a==='gender'||a==='shift-mode'){
    var group = el.dataset.action;
    document.querySelectorAll('[data-action="'+group+'"]').forEach(function(b){b.classList.toggle('on',b.dataset.val===el.dataset.val);});
    return;
  }
  
  if(a==='onb-save'){
    var g=(document.querySelector('[data-action="gender"].on')||{dataset:{val:'m'}}).dataset.val;
    var sm=(document.querySelector('[data-action="shift-mode"].on')||{dataset:{val:'day'}}).dataset.val;
    S.profile={age:+document.getElementById('f-age').value,height:+document.getElementById('f-height').value,weight:+document.getElementById('f-weight').value,target:+document.getElementById('f-target').value,gender:g,shiftMode:sm,startWeight:+document.getElementById('f-weight').value};
    S.weightHistory = [{date: today(), weight: +document.getElementById('f-weight').value}];
    S.tab='dash';render();return;
  }
  
  if(a==='save-profile'){
    var w=+document.getElementById('f-weight').value;
    var sm2=(document.querySelector('[data-action="shift-mode"].on')||{dataset:{val:S.profile.shiftMode}}).dataset.val;
    S.profile={age:+document.getElementById('f-age').value,height:+document.getElementById('f-height').value,weight:w,target:+document.getElementById('f-target').value,gender:S.profile.gender,shiftMode:sm2,startWeight:S.profile.startWeight||w};
    render();return;
  }
  
  if(a==='open-weight-modal'){S._weightModal = true; render(); return;}
  if(a==='close-weight-modal'){S._weightModal = false; render(); return;}
  if(a==='save-new-weight'){
    var nw = +document.getElementById('new-weight-input').value;
    if (nw > 0) updateWeight(nw);
    S._weightModal = false;
    render(); return;
  }
  
  if(a==='toggle-eaten'){
    var date=el.dataset.date||today();
    S.eaten[date]=S.eaten[date]||{};
    S.eaten[date][el.dataset.id]=!S.eaten[date][el.dataset.id];
    render();return;
  }
  
  if(a==='toggle-recipe'){
    var key=el.dataset.id+'_'+el.dataset.date;
    S._openRecipe=S._openRecipe===key?null:key;render();return;
  }
  
  if(a==='replace'){S._replace={id:el.dataset.id,date:el.dataset.date,type:el.dataset.type};render();return;}
  if(a==='close-modal'){S._replace=null;render();return;}
  
  if(a==='pick-alt'){
    S.plan[el.dataset.date]=S.plan[el.dataset.date]||{};
    S.plan[el.dataset.date][el.dataset.type]=el.dataset.id;
    S._replace=null;render();return;
  }
  
  if(a==='toggle-wo'){S._openWo=S._openWo===el.dataset.id?null:el.dataset.id;render();return;}
  if(a==='log-wo'){S.workouts.push({date:today(),id:el.dataset.id});render();return;}
  if(a==='shop-toggle'){var pid=el.dataset.pid;S.shoppingChecked[pid]=!S.shoppingChecked[pid];render();return;}
  
  if(a==='toggle-supplements'){S._supplementsOpen = !S._supplementsOpen; render(); return;}
  
  if(a==='cal-prev'||a==='cal-next'){
    var now2=new Date();var ym=S._calYM||{y:now2.getFullYear(),m:now2.getMonth()};
    var m2=ym.m+(a==='cal-next'?1:-1);var y2=ym.y;
    if(m2<0){m2=11;y2--;}if(m2>11){m2=0;y2++;}
    S._calYM={y:y2,m:m2};render();return;
  }
  
  if(a==='cal-day'){S._calSel=el.dataset.date;render();return;}
  
  if(a==='cal-toggle'){
    var d=el.dataset.date;
    if(S.shifts.indexOf(d)!==-1){
      S.shifts=S.shifts.filter(function(x){return x!==d;});
      delete S.plan[d];
    } else {
      S.shifts=[d].concat(S.shifts).sort();
      var tgt3=target(tdee(bmr(S.profile)));
      S.plan[d]=generatePlan(d,tgt3,S.profile.shiftMode);
    }
    S._calSel=d;render();return;
  }
  
  if(a==='regen-plan'){
    var dr=S._calSel||today();var tgt4=target(tdee(bmr(S.profile)));
    S.plan[dr]=generatePlan(dr,tgt4,S.profile.shiftMode);render();return;
  }

  if(a==='drink-water'){
    var idx = +el.dataset.idx;
    if(S.waterDrunk === idx) S.waterDrunk = idx - 1; 
    else S.waterDrunk = idx;
    render();return;
  }

  if(a==='sos'){ S._sos = true; render(); return; }
  if(a==='close-sos'){ S._sos = false; render(); return; }

  if(a==='share-progress'){
    var text = 'Я на TruckFuel. Мой вес сейчас ' + S.profile.weight + ' кг, иду к цели ' + S.profile.target + ' кг! Дефицит сегодня: ' + (tdee(bmr(S.profile)) - eatenKcalToday() + burnedToday()) + ' ккал. Присоединяйся!';
    if (navigator.share) {
      navigator.share({ title: 'Мой прогресс', text: text, url: window.location.href });
    } else {
      alert(text);
    }
    return;
  }

  if(a==='cook-mode'){S._cookDishId = el.dataset.id;render();return;}
  if(a==='close-cook'){S._cookDishId = null;render();return;}
});

var pressTimer=null;
document.addEventListener('touchstart',function(e){
  var el=e.target.closest('[data-action="cal-day"]');if(!el)return;
  pressTimer=setTimeout(function(){
    var d=el.dataset.date;
    if(S.shifts.indexOf(d)!==-1){
      S.shifts=S.shifts.filter(function(x){return x!==d;});delete S.plan[d];
    } else {
      S.shifts=[d].concat(S.shifts).sort();
      var tgt=target(tdee(bmr(S.profile)));
      S.plan[d]=generatePlan(d,tgt,S.profile.shiftMode);
    }
    S._calSel=d;render();
  },500);
},{passive:true});
document.addEventListener('touchend',function(){if(pressTimer)clearTimeout(pressTimer);});
document.addEventListener('touchmove',function(){if(pressTimer)clearTimeout(pressTimer);});

if(S.profile&&S.shifts.length===0){
  var t0=today();
  S.shifts=[t0,addDays(t0,1),addDays(t0,2),addDays(t0,3)];
}
if(S.profile){
  var tgtInit=target(tdee(bmr(S.profile)));
  S.shifts.forEach(function(d){if(!S.plan[d])S.plan[d]=generatePlan(d,tgtInit,S.profile.shiftMode);});
}

render();
</script>
</body>
</html>
